name: One-time Slack catch-up (temporary)

# Reposts the N most recent line tweets to Slack, oldest first, so the channel
# ends on the newest one. Read-only: does not touch seen IDs or the alert log,
# and commits nothing. Delete this file once it has been run.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many of the most recent line tweets to repost"
        required: true
        default: "5"

permissions:
  contents: read

concurrency:
  # Same group as the main bot so the two never post to Slack at the same time.
  group: nhl-line-alerts
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repost most recent line tweets
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CATCHUP_COUNT: ${{ github.event.inputs.count }}
        run: |
          python - <<'EOF'
          import os, time
          import gameday_lines_alert as bot

          count = int(os.environ["CATCHUP_COUNT"])

          df = bot.scrape_gameday_line_posts()
          df["status_id_int"] = df["status_id"].astype(int)
          latest = df.sort_values("status_id_int").tail(count).reset_index(drop=True)

          for _, row in bot.enrich_new_posts_with_oembed(latest).iterrows():
              message = bot.build_slack_notification(row).replace(
                  "🚨 *New NHL Line Tweet Detected*",
                  "🔁 *Catch-up repost (line tweet already alerted earlier)*",
              )
              bot.send_slack_message(message)
              print(f"Reposted {row['status_id']} from {row.get('source_handle')}")
              time.sleep(bot.REQUEST_SLEEP_SECONDS)
          EOF
